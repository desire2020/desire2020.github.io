---
layout: default
---
<article class="entry-page entry-page--wide">
  <header class="entry-header site-shell">
    <a class="entry-header__back" href="{{ "/chsliterature/index.html" | prepend: site.baseurl }}">← Writing</a>
    <p class="section-label">{{ page.category | default: "Writing" }}</p>
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %Y" }}</time>
  </header>
  <div class="entry-content entry-content--wide prose site-shell">
    {{ content }}
  </div>
</article>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.5/MathJax.js?config=TeX-MML-AM_CHTML" async></script>
<script type="text/x-mathjax-config">MathJax.Hub.Config({tex2jax:{inlineMath:[["$","$"],["\\(","\\)"]]}});</script>
