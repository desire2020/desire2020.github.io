<li class="timeline-item">
  <a class="timeline-card" href="{{ post.url | prepend: site.baseurl }}">
    <div class="timeline-card__meta">
      <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y · %m" }}</time>
      <span>{{ post.category }}</span>
    </div>
    <div class="timeline-card__copy">
      <h2>{{ post.title }}</h2>
      {% if post.summary %}
        <p>{{ post.summary }}</p>
      {% else %}
        <p>{{ post.content | strip_html | strip_newlines | truncatewords: 42 }}</p>
      {% endif %}
      <span class="timeline-card__action">Read entry ↗</span>
    </div>
  </a>
</li>
